[package]
name = "contextosd"
description = "ContextOS runtime server: compilation, admission, governed tool dispatch and audit over HTTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "contextosd"
path = "src/main.rs"

[dependencies]
contextos-contract = { workspace = true, features = ["schema"] }
contextos-kernel.workspace = true
contextos-store.workspace = true
contextos-audit.workspace = true
contextos-gateway.workspace = true
contextos-adapters.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "net"] }
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
hex.workspace = true
sha2.workspace = true
uuid.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
url.workspace = true
async-trait.workspace = true
mimalloc = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }
http = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[features]
default = ["otlp", "mimalloc"]
# A faster multi-threaded allocator (~17% lower dispatch latency in benchmarks).
mimalloc = ["dep:mimalloc"]
# OTLP/HTTP trace export, enabled at runtime by OTEL_EXPORTER_OTLP_ENDPOINT.
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:opentelemetry-http", "dep:http", "dep:bytes"]

[dev-dependencies]
jsonschema.workspace = true
ring.workspace = true
base64.workspace = true

[lints]
workspace = true
