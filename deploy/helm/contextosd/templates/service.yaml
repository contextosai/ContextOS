apiVersion: v1
kind: Service
metadata:
  name: {{ include "contextosd.fullname" . }}
  labels: {{- include "contextosd.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "contextosd.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }
