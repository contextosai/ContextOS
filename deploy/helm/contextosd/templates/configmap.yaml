apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "contextosd.fullname" . }}
  labels: {{- include "contextosd.labels" . | nindent 4 }}
data:
  contextosd.toml: |
    {{- .Values.config | nindent 4 }}
{{- range $name, $body := .Values.packs }}
  pack--{{ $name }}: {{ (kindIs "string" $body | ternary $body (toJson $body)) | quote }}
{{- end }}
{{- range $name, $body := .Values.capabilities }}
  capability--{{ $name }}: {{ (kindIs "string" $body | ternary $body (toJson $body)) | quote }}
{{- end }}
