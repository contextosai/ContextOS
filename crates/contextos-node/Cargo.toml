[package]
name = "contextos-node"
description = "Node.js bindings for the ContextOS kernel (N-API)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
# Extension modules link against their host at load time; no standalone test harness.
test = false
doctest = false

[dependencies]
contextos-embed = { workspace = true, features = ["schema"] }
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
