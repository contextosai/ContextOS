name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate version and release notes
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match workspace version {version!r}")
          notes = Path("docs/releases") / f"{tag}.md"
          if not notes.is_file() or not notes.read_text().strip():
              raise SystemExit(f"release notes missing or empty: {notes}")
          PY
  console:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: tower
      - uses: actions/upload-artifact@v7
        with:
          name: tower-dist
          path: tower/dist
          if-no-files-found: error

  binaries:
    needs: console
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, linux: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, linux: true }
          - { os: macos-latest, target: aarch64-apple-darwin, linux: false }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        if: ${{ !matrix.linux }}
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p contextosd -p ctx -p towerd
        if: ${{ !matrix.linux }}
      # Linux executables link against the oldest supported glibc (2.28), not the
      # runner's, so the archive starts on RHEL 8+, Debian 10+ and Ubuntu 20.04+.
      - name: Build against the glibc baseline
        if: ${{ matrix.linux }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:8 \
            scripts/build-linux-release.sh ${{ matrix.target }}
          sudo chown -R "$(id -u):$(id -g)" target
      - uses: actions/download-artifact@v8
        with:
          name: tower-dist
          path: tower-dist
      - name: Package
        run: |
          scripts/package-release.sh "contextos-${GITHUB_REF_NAME}-${{ matrix.target }}" \
            target/${{ matrix.target }}/release tower-dist
      # The archive must run on its own: every executable starts, and the
      # shared-guarantees demo runs from it outside the checkout without cargo. Linux
      # archives are run on the runner and on the oldest supported glibc.
      - name: Smoke-test the archive
        run: scripts/smoke-archive.sh "contextos-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
      - name: Smoke-test the archive on glibc 2.28
        if: ${{ matrix.linux }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e ARCHIVE="contextos-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            almalinux:8 bash -c 'sed -i -e "s/^mirrorlist=/#mirrorlist=/" -e "s/^# *baseurl=/baseurl=/" /etc/yum.repos.d/almalinux*.repo &&
              dnf install -y -q --setopt=retries=10 --setopt=timeout=300 python39 tar >/dev/null && scripts/smoke-archive.sh "$ARCHIVE"'
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: contextos-*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: contextos-*.tar.gz*
          if-no-files-found: error

  # The Python package with the in-process kernel, one abi3 wheel per platform. Linux
  # wheels are manylinux_2_28, the same glibc baseline as the archives.
  wheels:
    needs: validate
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { os: macos-latest, target: aarch64-apple-darwin, manylinux: "auto" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          rust-toolchain: 1.99.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: bindings/python
          args: --release --locked --out dist
      # The wheel, not the checkout, must provide `contextos`: run the kernel tests
      # from an isolated interpreter in a fresh virtual environment.
      - name: Smoke-test the wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-index bindings/python/dist/*.whl
          "$RUNNER_TEMP/venv/bin/python" -I bindings/python/tests/test_contextos.py
          "$RUNNER_TEMP/venv/bin/python" -I -c 'import contextos, os; assert contextos.__version__ == os.environ["GITHUB_REF_NAME"][1:]'
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: bindings/python/dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  # The HTTP clients: a pure-Python wheel (pip's fallback on every other platform) and
  # the `contextos-client` npm package.
  clients:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
      - run: npm install --global npm@11.8.0 --ignore-scripts --no-audit --no-fund
      - name: Build
        run: |
          python scripts/package_clients.py python dist
          python scripts/package_clients.py node "$RUNNER_TEMP/npm"
          npm pack "$RUNNER_TEMP/npm/contextos-client" --pack-destination dist
      - name: Smoke-test the packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-index dist/*-py3-none-any.whl
          "$RUNNER_TEMP/venv/bin/python" -I -c 'import contextos, contextos.client, contextos.aio; assert contextos._native is None'
          app="$RUNNER_TEMP/app"
          mkdir "$app" && cd "$app"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/dist/contextos-client-$version.tgz" typescript@5.6.3
          node -e 'import("contextos-client").then(m => { if (typeof m.Client !== "function") process.exit(1) })'
          printf 'import { Client, governedTool } from "contextos-client";\nconst c: Client = new Client("http://x", { token: "t" });\nvoid c; void governedTool;\n' > check.mts
          npx tsc --noEmit --strict --module nodenext --moduleResolution nodenext --lib es2022,dom check.mts
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: clients
          path: dist/*
          if-no-files-found: error

  sbom:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: cargo install --locked cargo-cyclonedx@0.5.7
      # Source inventories cover every target and feature, rather than describing
      # only the Linux host used by this job. One <crate>.cdx.json per member.
      - run: cargo cyclonedx --format json --all-features --target all
      - name: Verify source inventories and lockfile
        run: |
          git diff --exit-code -- Cargo.lock
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          for manifest in Path("crates").glob("*/Cargo.toml"):
              name = tomllib.loads(manifest.read_text())["package"]["name"]
              path = manifest.with_name(f"{name}.cdx.json")
              bom = json.loads(path.read_text())
              if bom.get("bomFormat") != "CycloneDX" or bom.get("metadata", {}).get("component", {}).get("version") != version:
                  raise SystemExit(f"invalid or incorrectly versioned inventory: {path}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: crates/*/*.cdx.json
          if-no-files-found: error

  image:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/contextosd:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/contextosd:${{ steps.version.outputs.tag }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/contextosd@${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/contextosd
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [binaries, wheels, clients, sbom, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
      # Packages ride on the draft; publish-packages.yml sends them to PyPI and npm
      # only when a maintainer publishes the release.
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: packages
      - uses: actions/download-artifact@v8
        with:
          name: clients
          path: packages
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            archive="contextos-$GITHUB_REF_NAME-$target.tar.gz"
            test -f "$archive"
            shasum -a 256 -c "$archive.sha256"
          done
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          mapfile -t sboms < <(find sbom -name '*.cdx.json' -type f)
          test "${#sboms[@]}" -gt 0
          # Three platform wheels, the pure-Python wheel and the npm tarball.
          mapfile -t packages < <(find packages -type f \( -name '*.whl' -o -name 'contextos-client-*.tgz' \))
          test "${#packages[@]}" -eq 5
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "ContextOS ${GITHUB_REF_NAME#v}" --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            "${release_flags[@]}" contextos-*.tar.gz* "${sboms[@]}" "${packages[@]}"
