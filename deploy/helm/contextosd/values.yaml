image:
  repository: ghcr.io/contextosai/contextosd
  tag: ""            # defaults to the chart appVersion
  digest: ""         # set to pin by digest (recommended in production)
  pullPolicy: IfNotPresent

replicaCount: 3

# contextosd.toml. Paths for packs and capabilities refer to the mounted files below.
# Never put secrets here: the config names environment variables, which come from
# `secretName`.
config: |
  packs = []
  capabilities = []

  [server]
  listen = "0.0.0.0:8080"

  [store]
  kind = "postgres"
  url_env = "CONTEXTOS_DATABASE_URL"

  [audit]
  signing_seed_env = "CONTEXTOS_AUDIT_SEED"
  key_id = "audit-2026-01"

  [support]
  implementation_id = "contextos-rs"
  implementation_version = "0.1.0-alpha.17"
  profiles = ["contextos.core"]
  controls = ["identity.authenticated", "authority.scoped", "policy.fail_visible", "context.integrity", "audit.correlated"]

  # Tenant limits are shared across the live replicas (see docs/GUIDE.md).
  # [limits]
  # requests_per_second = 500.0
  # burst = 1000.0
  # max_concurrent_dispatch = 256

  # Erase finished runs' personal content after this many days (off when unset).
  # [retention]
  # run_content_days = 30

# Context Pack and capability manifest files (JSON strings or objects), mounted at /etc/contextos/packs/<name>
# and /etc/contextos/capabilities/<name>.
packs: {}
capabilities: {}

# Publish packs from git instead of `packs`: git-sync checks out `repo` at `ref` into
# a volume each pod reads as a pack directory, once before contextosd starts and then
# every `periodSeconds`. Point the config at it and let the server pick up new
# versions (docs/GUIDE.md, "Publish pack versions without a restart"):
#   pack_dirs = ["/var/lib/contextos/pack-sync/current/<path in the repo>"]
#   pack_reload_secs = 30
# The checkout replaces itself atomically, and a reload only adds versions: a changed
# file under a loaded pack reference is refused, never applied, and a pod that starts
# with one fails to start (references are bound to their digest in the store). Write access to the
# repository is the authority to publish packs.
packSync:
  enabled: false
  image: registry.k8s.io/git-sync/git-sync:v4.4.0
  repo: ""           # https://… or git@…; required when enabled
  ref: main          # branch, tag or commit
  periodSeconds: 30
  # Secret whose keys become git-sync's environment (for HTTPS: GITSYNC_USERNAME and
  # GITSYNC_PASSWORD); empty for a public repository.
  secretName: ""
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# Existing Secret whose keys become environment variables (for example
# CONTEXTOS_DATABASE_URL, CONTEXTOS_AUDIT_SEED, provider tokens). Manage it with your
# secret store (External Secrets, Vault, Sealed Secrets); the chart never creates it.
secretName: contextosd

logLevel: info

# Sidecars beside contextosd in each pod (a database proxy, a secrets agent), and the
# volumes they mount. They share the pod's network, so contextosd reaches them on
# loopback.
extraContainers: []
extraVolumes: []
# Environment and mounts for the contextosd container itself, for example a private CA
# bundle (a ConfigMap in extraVolumes, mounted here, named by CONTEXTOS_CA_BUNDLE).
extraEnv: []
extraVolumeMounts: []

# Schema migration as a pre-install/pre-upgrade hook, run as a role that owns the
# schema so the runtime role (in `secretName`) needs no DDL rights. `secretName` here
# names a Secret holding that owner role's URL under `urlEnv`.
migration:
  enabled: false
  secretName: ""
  urlEnv: CONTEXTOS_DATABASE_URL
  backoffLimit: 3
  activeDeadlineSeconds: 600

resources:
  requests: { cpu: 500m, memory: 256Mi }
  limits: { memory: 1Gi }

service:
  type: ClusterIP
  port: 8080

podDisruptionBudget:
  enabled: true
  minAvailable: 2

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 30
  targetCPUUtilizationPercentage: 70

# Restrict ingress to the namespaces that call contextosd, and egress to the store,
# identity provider, fact services and tool endpoints.
networkPolicy:
  enabled: true
  ingressFrom: []    # NetworkPolicyPeer list; empty allows same-namespace pods only
  egressTo: []       # NetworkPolicyEgressRule list, added to DNS egress; empty leaves egress unrestricted

# Confine agent workloads so contextosd is the only path to the systems they act on
# (docs/integrations/egress.md). The agents' pods may reach contextosd, DNS and
# `allowTo` (your model gateway), nothing else; contextosd's own policy admits them.
agentEgress:
  enabled: false
  namespace: ""      # the agents' namespace; defaults to the release's
  podSelector: {}    # required: selects the agent pods, never empty
  allowTo: []        # NetworkPolicyEgressRule list, for example the model gateway

serviceMonitor:
  enabled: false
  interval: 30s

# Alerting rules from files/contextos-rules.yaml (runbooks in docs/INCIDENT.md, "Alerts").
# `labels` are added to the PrometheusRule so your Prometheus rule selector picks it up.
prometheusRule:
  enabled: false
  labels: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
