[package]
name = "contextos-contract"
description = "ContextOS contract types, RFC 8785 canonical JSON and contract validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["schema"]
# JSON Schema validation against the published schemas (not needed by the pure kernel).
schema = ["dep:jsonschema"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
ryu-js.workspace = true
icu_collator.workspace = true
jsonschema = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
