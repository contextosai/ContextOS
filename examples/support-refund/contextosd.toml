# Quickstart configuration: in-memory store, development mode (loopback HTTP allowed).
packs = ["examples/support-refund/pack.json"]
capabilities = ["examples/support-refund/capabilities/issue_refund.json", "examples/support-refund/capabilities/lookup_order.json"]

[server]
listen = "127.0.0.1:8080"
mode = "development"

[store]
kind = "memory"

[audit]
signing_seed_env = "CONTEXTOS_AUDIT_SEED"
key_id = "dev-audit"

[support]
implementation_id = "contextos-rs"
implementation_version = "0.1.0"
profiles = ["contextos.core"]
controls = ["identity.authenticated", "authority.scoped", "policy.fail_visible", "context.integrity", "audit.correlated",
            "effects.reconciled", "approval.bound", "network.mediated", "data.flow_policy"]

[identity]
trust_domain = "contextos.dev"
gateway_principal_id = "contextosd"

[providers.authority]
url = "http://127.0.0.1:7701"
[providers.constraints]
url = "http://127.0.0.1:7702"
[providers.approvals]
url = "http://127.0.0.1:7703"

[[adapters]]
id = "adp_payments"
kind = "mcp"
endpoint = "http://127.0.0.1:7704/mcp"

[[adapters]]
id = "adp_orders"
kind = "mcp"
endpoint = "http://127.0.0.1:7704/mcp"

# Key "dev-key-0123456789abcdef0123456789abcdef"
[[api_keys]]
key_sha256 = "sha256:REPLACED_BY_RUN_SH"
tenant_id = "tenant_acme_prod"
principal_id = "svc_quickstart"
scopes = ["compile", "admit", "dispatch", "audit:read"]

# Development evaluator, key "dev-judge-0123456789abcdef0123456789abcd". An evaluator
# holds only `evaluate`: a key that can also run agents cannot score them.
[[api_keys]]
key_sha256 = "sha256:99acec3e900c700b272b3f9c5e98fc3266eee5ae5d15e7f8a9b7fedcb3af9619"
tenant_id = "tenant_acme_prod"
principal_id = "svc_quality_judge"
scopes = ["evaluate"]

# Development operator, key "dev-ops-0123456789abcdef0123456789abcdef": holds the kill
# switch (revoke and restore tenants, packs, agents, adapters, capabilities).
[[api_keys]]
key_sha256 = "sha256:93a97c917366b95209ee98b66dfa87597d8b960ad13a8ef0fac1776d37c24385"
tenant_id = "tenant_acme_prod"
principal_id = "svc_oncall"
scopes = ["control"]

# Development LLM gateway, key "dev-meter-0123456789abcdef0123456789abcd": holds only
# `meter`, so the usage it reports settles as measured (examples/metering-proxy).
[[api_keys]]
key_sha256 = "sha256:cbbf550b2bf8a9846c146c2367578d000be6526bfe3cff8ed8264ae595d314fd"
tenant_id = "tenant_acme_prod"
principal_id = "svc_llm_gateway"
scopes = ["meter"]
