name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate version and release notes
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match workspace version {version!r}")
          notes = Path("docs/releases") / f"{tag}.md"
          if not notes.is_file() or not notes.read_text().strip():
              raise SystemExit(f"release notes missing or empty: {notes}")
          PY
  console:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: tower
      - uses: actions/upload-artifact@v7
        with:
          name: tower-dist
          path: tower/dist
          if-no-files-found: error

  binaries:
    needs: console
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, linux: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, linux: true }
          - { os: macos-latest, target: aarch64-apple-darwin, linux: false }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
        if: ${{ !matrix.linux }}
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p contextosd -p ctx -p towerd
        if: ${{ !matrix.linux }}
      # Linux executables link against the oldest supported glibc (2.28), not the
      # runner's, so the archive starts on RHEL 8+, Debian 10+ and Ubuntu 20.04+.
      - name: Build against the glibc baseline
        if: ${{ matrix.linux }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:8 \
            scripts/build-linux-release.sh ${{ matrix.target }}
          sudo chown -R "$(id -u):$(id -g)" target
      - uses: actions/download-artifact@v8
        with:
          name: tower-dist
          path: tower-dist
      - name: Package
        run: |
          scripts/package-release.sh "contextos-${GITHUB_REF_NAME}-${{ matrix.target }}" \
            target/${{ matrix.target }}/release tower-dist
      # The archive must run on its own: every executable starts, and the
      # shared-guarantees demo runs from it outside the checkout without cargo. Linux
      # archives are run on the runner and on the oldest supported glibc.
      - name: Smoke-test the archive
        run: scripts/smoke-archive.sh "contextos-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
      - name: Smoke-test the archive on glibc 2.28
        if: ${{ matrix.linux }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e ARCHIVE="contextos-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            almalinux:8 bash -c 'sed -i -e "s/^mirrorlist=/#mirrorlist=/" -e "s/^# *baseurl=/baseurl=/" /etc/yum.repos.d/almalinux*.repo &&
              dnf install -y -q --setopt=retries=10 --setopt=timeout=300 python39 tar >/dev/null && scripts/smoke-archive.sh "$ARCHIVE"'
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: contextos-*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: contextos-*.tar.gz*
          if-no-files-found: error

  sbom:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
      - run: cargo install --locked cargo-cyclonedx@0.5.7
      # Source inventories cover every target and feature, rather than describing
      # only the Linux host used by this job. One <crate>.cdx.json per member.
      - run: cargo cyclonedx --format json --all-features --target all
      - name: Verify source inventories and lockfile
        run: |
          git diff --exit-code -- Cargo.lock
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          for manifest in Path("crates").glob("*/Cargo.toml"):
              name = tomllib.loads(manifest.read_text())["package"]["name"]
              path = manifest.with_name(f"{name}.cdx.json")
              bom = json.loads(path.read_text())
              if bom.get("bomFormat") != "CycloneDX" or bom.get("metadata", {}).get("component", {}).get("version") != version:
                  raise SystemExit(f"invalid or incorrectly versioned inventory: {path}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: crates/*/*.cdx.json
          if-no-files-found: error

  image:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/contextosd:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/contextosd:${{ steps.version.outputs.tag }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/contextosd@${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/contextosd
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [binaries, sbom, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            archive="contextos-$GITHUB_REF_NAME-$target.tar.gz"
            test -f "$archive"
            shasum -a 256 -c "$archive.sha256"
          done
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          mapfile -t sboms < <(find sbom -name '*.cdx.json' -type f)
          test "${#sboms[@]}" -gt 0
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "ContextOS ${GITHUB_REF_NAME#v}" --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            "${release_flags[@]}" contextos-*.tar.gz* "${sboms[@]}"
