version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns: ["opentelemetry*", "tracing-opentelemetry"]
      tokio-stack:
        patterns: ["tokio*", "axum*", "tower*", "hyper*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its tags name Rust versions; it moves with rust-toolchain.toml, by hand.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /conformance
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /tower
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /examples/frameworks/openai-agents-js
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /examples/frameworks/vercel-ai-sdk
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /examples/frameworks/mastra
    schedule:
      interval: weekly
