# Unit tests for the alerting rules: promtool test rules deploy/alerts/contextos-rules.test.yaml
rule_files:
  - ../helm/contextosd/files/contextos-rules.yaml
evaluation_interval: 1m

tests:
  - name: saturation and unknown outcomes page
    interval: 1m
    input_series:
      - series: 'contextos_dispatch_refusals_total{reason="shared_guarantee_saturated",pod="a"}'
        values: '0x10 3x20'
      - series: 'contextos_dispatch_outcomes_total{capability="adp_payments.issue_refund",status="unknown",pod="a"}'
        values: '0x10 6x20'
      - series: 'contextos_dispatch_outcomes_total{capability="adp_payments.issue_refund",status="completed",pod="a"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: ContextOSSharedGuaranteeSaturated
        exp_alerts: []
      - eval_time: 9m
        alertname: ContextOSUnknownOutcomes
        exp_alerts: []
      - eval_time: 15m
        alertname: ContextOSSharedGuaranteeSaturated
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: A shared guarantee refuses new effects because a resource has too many live receipts.
              description: 3 dispatches were refused with shared_guarantee_saturated in the last 10 minutes. Every new effect on the saturated resource is refused until held receipts are reconciled.
              runbook_url: https://github.com/contextosai/ContextOS/blob/main/docs/INCIDENT.md#contextossharedguaranteesaturated
      - eval_time: 15m
        alertname: ContextOSUnknownOutcomes
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Tool responses are being lost; each one holds capacity until reconciled.
              description: 6 dispatches ended with an unknown outcome in the last 15 minutes. Do not retry them; reconcile.
              runbook_url: https://github.com/contextosai/ContextOS/blob/main/docs/INCIDENT.md#contextosunknownoutcomes

  - name: a blocked spike against a quiet baseline pages after 10 minutes
    interval: 1m
    input_series:
      # Six hours at 10 completed and 0.1 blocked a minute, then half of all dispatches blocked.
      - series: 'contextos_dispatch_outcomes_total{capability="adp_payments.issue_refund",status="completed",pod="a"}'
        values: '0+10x360 3600+5x30'
      - series: 'contextos_dispatch_outcomes_total{capability="adp_payments.issue_refund",status="blocked",pod="a"}'
        values: '0+0.1x360 36+5x30'
    alert_rule_test:
      - eval_time: 360m
        alertname: ContextOSBlockedSpike
        exp_alerts: []
      - eval_time: 385m
        alertname: ContextOSBlockedSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Governance is blocking far more dispatches than usual.
              description: More than 5% of dispatches were blocked over 15 minutes, and more than three times the 6-hour rate. A policy, pack or limit change may be refusing legitimate work.
              runbook_url: https://github.com/contextosai/ContextOS/blob/main/docs/INCIDENT.md#contextosblockedspike

  - name: low volume is never a blocked spike
    interval: 1m
    input_series:
      - series: 'contextos_dispatch_outcomes_total{capability="x.y",status="blocked",pod="a"}'
        values: '0+0.5x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ContextOSBlockedSpike
        exp_alerts: []

  - name: guard saturation and revocations are reported per reason
    interval: 1m
    input_series:
      - series: 'contextos_dispatch_refusals_total{reason="loop_guard_saturated",pod="a"}'
        values: '0 2x10'
      - series: 'contextos_dispatch_refusals_total{reason="revoked_capability",pod="b"}'
        values: '0 4x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ContextOSGuardSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
              reason: loop_guard_saturated
            exp_annotations:
              summary: 'Runs are hitting a hard cap: loop_guard_saturated.'
              description: 2 dispatches were refused with loop_guard_saturated in the last 15 minutes.
              runbook_url: https://github.com/contextosai/ContextOS/blob/main/docs/INCIDENT.md#contextosguardsaturated
      - eval_time: 5m
        alertname: ContextOSRevocationEnforced
        exp_alerts:
          - exp_labels:
              severity: info
              reason: revoked_capability
            exp_annotations:
              summary: 'The kill switch is refusing dispatches (revoked_capability).'
              description: 4 dispatches were refused by a revocation in the last 15 minutes. Expected while an incident is contained; otherwise check who revoked what.
              runbook_url: https://github.com/contextosai/ContextOS/blob/main/docs/INCIDENT.md#contextosrevocationenforced

  - name: server errors above 1% for 10 minutes
    interval: 1m
    input_series:
      - series: 'contextos_http_requests_total{route="/v1/runs/{run_id}/dispatch",status="200",pod="a"}'
        values: '0+100x30'
      - series: 'contextos_http_requests_total{route="/v1/runs/{run_id}/dispatch",status="503",pod="a"}'
        values: '0+5x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: ContextOSServerErrors
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: More than 1% of contextosd requests fail with a server error.
              description: Server errors have been above 1% of requests for 10 minutes. Governed calls fail closed, so agents see errors, not unchecked effects.
              runbook_url: https://github.com/contextosai/ContextOS/blob/main/docs/INCIDENT.md#contextosservererrors

  - name: hold gauges page per guarantee
    interval: 1m
    input_series:
      - series: 'contextos_shared_hold_oldest_seconds{guarantee="refunds",pod="a"}'
        values: '0x5 1000x10'
      - series: 'contextos_shared_holds{guarantee="refunds",state="conflicting_facts",pod="a"}'
        values: '0x5 1x10'
      - series: 'contextos_shared_receipts_fill_ratio{guarantee="refunds",pod="a"}'
        values: '0.5x5 0.9x10'
      - series: 'contextos_shared_ledgers_unreadable{pod="a"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: ContextOSHeldEffectsAging
        exp_alerts: []
      - eval_time: 8m
        alertname: ContextOSHeldEffectsAging
        exp_alerts:
          - exp_labels:
              severity: warning
              guarantee: refunds
            exp_annotations:
              summary: 'A hold under refunds has waited more than 15 minutes.'
              description: The oldest held effect under refunds started more than 15 minutes ago and still holds capacity. Waiting resolves nothing; follow its next safe step.
              runbook_url: https://github.com/contextosai/ContextOS/blob/main/docs/INCIDENT.md#contextosheldeffectsaging
      - eval_time: 8m
        alertname: ContextOSConflictingFacts
        exp_alerts:
          - exp_labels:
              severity: critical
              guarantee: refunds
            exp_annotations:
              summary: 'Contradictory outcomes were recorded for an effect under refunds.'
              description: An operation under refunds has contradictory recorded outcomes. Its capacity stays held; treat it as an incident and resolve it with the provider.
              runbook_url: https://github.com/contextosai/ContextOS/blob/main/docs/INCIDENT.md#contextosconflictingfacts
      - eval_time: 8m
        alertname: ContextOSReceiptsNearCap
        exp_alerts:
          - exp_labels:
              severity: warning
              guarantee: refunds
            exp_annotations:
              summary: 'A resource under refunds is close to its receipt cap.'
              description: The fullest ledger under refunds uses more than 80% of its 1024 live receipts. At the cap every new effect on that resource is refused.
              runbook_url: https://github.com/contextosai/ContextOS/blob/main/docs/INCIDENT.md#contextosreceiptsnearcap
      - eval_time: 8m
        alertname: ContextOSUnreadableLedgers
        exp_alerts: []

  - name: a sweep that keeps completing is not stale
    interval: 1m
    input_series:
      - series: 'contextos_governance_sweep_completed_timestamp_seconds{pod="a"}'
        values: '0+60x40'
      - series: 'contextos_dispatch_outcomes_total{capability="x.y",status="completed",pod="a"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: ContextOSGovernanceSweepStale
        exp_alerts: []

  - name: a sweep that stopped is stale once its series goes away
    interval: 1m
    input_series:
      - series: 'contextos_governance_sweep_completed_timestamp_seconds{pod="a"}'
        values: '0+60x5'
      - series: 'contextos_dispatch_outcomes_total{capability="x.y",status="completed",pod="a"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: ContextOSGovernanceSweepStale
        exp_alerts: []
      - eval_time: 35m
        alertname: ContextOSGovernanceSweepStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The governance sweep has not completed for 15 minutes.
              description: No replica has published hold gauges recently, so the hold alerts above cannot fire. Check that a leader replica is running and can read the store.
              runbook_url: https://github.com/contextosai/ContextOS/blob/main/docs/INCIDENT.md#contextosgovernancesweepstale

  - name: escalations waiting an hour
    interval: 1m
    input_series:
      - series: 'contextos_escalations_open{pod="a"}'
        values: '2x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: ContextOSEscalationsWaiting
        exp_alerts: []
      - eval_time: 80m
        alertname: ContextOSEscalationsWaiting
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: Policy escalations have been waiting for a human for an hour.
              description: 2 escalations are open. The calls they block stay blocked until someone handles them.
              runbook_url: https://github.com/contextosai/ContextOS/blob/main/docs/INCIDENT.md#contextosescalationswaiting

  - name: abandoned notifications page per webhook
    interval: 1m
    input_series:
      - series: 'contextos_notifications_total{webhook="oncall",outcome="abandoned",pod="a"}'
        values: '0x10 2x20'
      - series: 'contextos_notifications_total{webhook="oncall",outcome="delivered",pod="a"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: ContextOSNotificationsFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: ContextOSNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              webhook: oncall
            exp_annotations:
              summary: 'Escalation notifications to oncall are being given up.'
              description: 2 escalation notifications to oncall were given up after their retries in the last hour, so approvers were not told.
              runbook_url: https://github.com/contextosai/ContextOS/blob/main/docs/INCIDENT.md#contextosnotificationsfailing
