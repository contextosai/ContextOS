{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "contextosd.fullname" . }}
  labels:
    {{- include "contextosd.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- .Files.Get "files/contextos-rules.yaml" | fromYaml | toYaml | nindent 2 }}
{{- end }}
