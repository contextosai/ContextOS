# Supply-chain policy, enforced in CI by cargo-deny.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the build unless explicitly reviewed and listed here
# with a justification and an expiry.
ignore = [
    # sqlx-core 0.8 requires webpki-roots ^0.26; 0.26.11 is a semver-trick shim that
    # re-exports webpki-roots 1, locked at the patched 1.0.10. Expires with sqlx 0.9.
    { id = "RUSTSEC-2026-0381", reason = "0.26.11 re-exports the patched webpki-roots 1.0.10" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "CDLA-Permissive-2.0", "Unlicense", "BSL-1.0", "0BSD",
]
# Workspace crates (Apache-2.0) are not published to crates.io yet.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; every crate is publish = false.
allow-wildcard-paths = true
# OpenSSL is never linked: TLS is rustls only.
deny = [{ crate = "openssl-sys" }, { crate = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
