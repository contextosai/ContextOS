{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "contextosd.fullname" . }}
  labels: {{- include "contextosd.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "contextosd.selectorLabels" . | nindent 6 }}
  endpoints:
    - { port: http, path: /metrics, interval: {{ .Values.serviceMonitor.interval }} }
{{- end }}
