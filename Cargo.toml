[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/contextosai/ContextOS"
publish = false

[workspace.dependencies]
contextos-contract = { path = "crates/contextos-contract", default-features = false }
contextos-policy = { path = "crates/contextos-policy" }
contextos-kernel = { path = "crates/contextos-kernel" }
contextos-store = { path = "crates/contextos-store" }
contextos-audit = { path = "crates/contextos-audit" }
contextos-gateway = { path = "crates/contextos-gateway" }
contextos-adapters = { path = "crates/contextos-adapters" }
contextos-embed = { path = "crates/contextos-embed", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
ryu-js = "1"
icu_collator = "2"
proptest = "1"
flate2 = "1"
url = "2"
ed25519-dalek = { version = "2", features = ["zeroize"] }
base64 = "0.22"
zeroize = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["limit", "timeout", "trace", "request-id", "catch-panic", "set-header"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
opentelemetry-http = { version = "0.33", default-features = false }
http = "1"
bytes = "1"
toml = "0.8"
uuid = { version = "1", features = ["v7"] }
clap = { version = "4", features = ["derive"] }
jsonwebtoken = "9"
ring = "0.17"
mimalloc = { version = "0.1", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros"] }
jsonschema = { version = "0.59", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
match_same_arms = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
many_single_char_names = "allow"
# Kernel `expect`s only assert invariants established by prior shape validation.
missing_panics_doc = "allow"
# Contract semantics require exact IEEE-754 comparison (JavaScript parity), never an epsilon.
float_cmp = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
