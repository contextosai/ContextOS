[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/contextosai/ContextOS"
publish = false

[workspace.dependencies]
contextos-contract = { path = "crates/contextos-contract" }
contextos-policy = { path = "crates/contextos-policy" }
contextos-kernel = { path = "crates/contextos-kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
ryu-js = "1"
icu_collator = "2"
proptest = "1"
flate2 = "1"
url = "2"
jsonschema = { version = "0.59", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
# Kernel `expect`s only assert invariants established by prior shape validation.
missing_panics_doc = "allow"
# Contract semantics require exact IEEE-754 comparison (JavaScript parity), never an epsilon.
float_cmp = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
