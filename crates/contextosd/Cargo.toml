[package]
name = "contextosd"
description = "ContextOS runtime server: compilation, admission, governed tool dispatch and audit over HTTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "contextosd"
path = "src/main.rs"

[dependencies]
bytes.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
contextos-contract = { workspace = true, features = ["schema"] }
contextos-kernel.workspace = true
contextos-store.workspace = true
contextos-audit.workspace = true
contextos-gateway.workspace = true
contextos-adapters.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "net", "io-std", "io-util"] }
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
hex.workspace = true
ring.workspace = true
sha2.workspace = true
uuid.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
# Inbound TLS ([server.tls]): the same rustls and ring the outgoing clients use.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio", "http1", "http2"] }
http-body = "1"
url.workspace = true
async-trait.workspace = true
mimalloc = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }
http = { workspace = true, optional = true }

[features]
default = ["otlp", "mimalloc"]
# A faster multi-threaded allocator (~17% lower dispatch latency in benchmarks).
mimalloc = ["dep:mimalloc"]
# OTLP/HTTP trace export, enabled at runtime by OTEL_EXPORTER_OTLP_ENDPOINT.
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:opentelemetry-http", "dep:http"]

[dev-dependencies]
jsonschema.workspace = true
flate2.workspace = true
ring.workspace = true
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
