name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Commit gate regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
  artifact-transport:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Prepare release transport fixtures
        run: |
          mkdir -p smoke/binaries smoke/sbom smoke/other
          python3 -c 'from pathlib import Path; Path("smoke/binaries/binary.bin").write_bytes(bytes(range(256)))'
          echo '{"bomFormat":"CycloneDX"}' > smoke/sbom/contextos.cdx.json
          echo 'unrelated build record' > smoke/other/build.dockerbuild
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-smoke
          path: smoke/binaries
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: smoke/sbom
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: transport-smoke.dockerbuild
          path: smoke/other
          retention-days: 1
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: received
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: received/sbom
      - name: Verify bytes and release payload selection
        run: |
          cmp smoke/binaries/binary.bin received/binary.bin
          cmp smoke/sbom/contextos.cdx.json received/sbom/contextos.cdx.json
          python3 -c 'from pathlib import Path; assert sum(p.is_file() for p in Path("received").rglob("*")) == 2'
  conformance:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: conformance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global npm@11.8.0 --ignore-scripts --no-audit --no-fund
      - name: Verify the pinned reference snapshot
        run: cd reference && sha256sum --check SHA256SUMS
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=high
      - name: Regenerate every reference vector
        run: env -u CONTEXTOS_SPEC npm test
      - name: Reject schema or vector content drift
        run: python3 ../scripts/check_conformance.py
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: contextos
          POSTGRES_PASSWORD: contextos
          POSTGRES_DB: contextos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contextos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONTEXTOS_TEST_DATABASE_URL: postgres://contextos:contextos@localhost:5432/contextos_test
      # Fit Clippy plus every test target on the hosted runner's disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: RUST_LOG=info cargo test --workspace --all-targets
      - name: Shared-limit failure drill (three processes, SIGKILL, database restart)
        env:
          CONTEXTOS_DRILL_DATABASE_URL: postgres://contextos:contextos@localhost:5432/contextos_drill
          CONTEXTOS_DRILL_PG_RESTART: docker restart -t 0 ${{ job.services.postgres.id }}
          CONTEXTOS_BIN: ${{ github.workspace }}/target/debug
        run: |
          PGPASSWORD=contextos psql -h localhost -U contextos -d contextos_test -c 'CREATE DATABASE contextos_drill'
          cargo build -q -p contextosd -p ctx
          ./examples/postgres-drill/run.sh
      - name: Benchmarks against PostgreSQL (smoke)
        env:
          CONTEXTOS_BENCH_DATABASE_URL: ${{ env.CONTEXTOS_TEST_DATABASE_URL }}
        run: cargo bench -p contextos-gateway --bench dispatch -- --warm-up-time 1 --measurement-time 3 postgres
  bindings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: WASM (import-free module)
        run: |
          cargo build --release -p contextos-wasm --target wasm32-unknown-unknown
          node bindings/wasm/test.mjs target/wasm32-unknown-unknown/release/contextos_wasm.wasm
      - name: Node (N-API)
        run: |
          cargo build --release -p contextos-node
          cp target/release/libcontextos_node.so "$RUNNER_TEMP/contextos.node"
          CONTEXTOS_NATIVE="$RUNNER_TEMP/contextos.node" node bindings/node/test.mjs
      - name: Python (PyO3 abi3)
        run: |
          cargo build --release -p contextos-py
          cp target/release/lib_native.so bindings/python/contextos/_native.abi3.so
          PYTHONPATH=bindings/python python bindings/python/tests/test_contextos.py
      - name: Python HTTP client against contextosd
        run: |
          cargo build --release -p contextosd
          PYTHONPATH=bindings/python python bindings/python/tests/test_client.py
      - name: Examples (quickstart, governed agent loop, metering, Tower)
        run: |
          ./examples/support-refund/run.sh
          ./examples/shared-guarantees/run.sh
          ./examples/agent-loop/run.sh
          ./examples/peer-coordination/run.sh
          ./examples/compensation/run.sh
          ./examples/metering-proxy/run.sh
          ./examples/tower/run.sh
      - name: Node HTTP client against contextosd
        run: |
          node bindings/node/test_client.mjs
          npx -y -p typescript@5.6.3 tsc --noEmit --strict --lib es2022,dom bindings/node/client.d.ts
  frameworks:
    # Each framework example on its own agent loop with a scripted model, plain and
    # with an approval that a scripted reviewer grants.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [langgraph, openai-agents, openai-agents-js, google-adk, claude-agent-sdk, crewai,
                  pydantic-ai, llamaindex, microsoft-agent-framework, vercel-ai-sdk, mastra]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: ./examples/frameworks/run.sh ${{ matrix.example }}
      - run: ./examples/frameworks/run.sh ${{ matrix.example }} --approval
  tower:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tower
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cargo install --locked --features cli cargo-about@0.9.2
      - run: npm ci --prefix tower --ignore-scripts --no-audit --no-fund
      - name: Verify dependency license and attribution notices
        run: bash scripts/generate-notices.sh --check
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p contextos-embed --test fuzz
        env:
          CONTEXTOS_FUZZ_CASES: "20000"
  # The Linux release executables are built against glibc 2.28 (AlmaLinux 8), so they
  # start on RHEL 8+, Debian 10+ and Ubuntu 20.04+. Catch a dependency that needs a
  # newer glibc, or a build break on the baseline, before release day.
  linux-glibc-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build on glibc 2.28 and run the shared-guarantees demo there
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e CARGO_TARGET_DIR=/src/target/baseline almalinux:8 bash -c '
            scripts/build-linux-release.sh x86_64-unknown-linux-gnu &&
            dnf install -y -q --setopt=retries=10 --setopt=timeout=300 python39 >/dev/null &&
            bin=/src/target/baseline/x86_64-unknown-linux-gnu/release &&
            for b in contextosd ctx towerd; do "$bin/$b" --version; done &&
            CONTEXTOS_BIN="$bin" env PATH=/usr/bin:/bin ./examples/shared-guarantees/run.sh'
  # The chart and image installed the way the docs describe a production deployment:
  # a schema-owner migration hook, a least-privilege runtime role, rolling restart and
  # upgrade. Rendering alone missed an image that exited under the chart's arguments.
  kubernetes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: contextosd:e2e
          cache-from: type=gha,scope=kubernetes-e2e
          cache-to: type=gha,mode=max,scope=kubernetes-e2e
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Create a kind cluster and load the image
        run: |
          curl -sSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.29.0/kind-linux-amd64
          chmod +x kind
          ./kind create cluster --wait 120s
          ./kind load docker-image contextosd:e2e
      - name: Install and exercise the chart
        run: IMAGE=contextosd:e2e ./deploy/kind/e2e.sh
  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Lint and validate the chart
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm lint deploy/helm/contextosd
          helm template t deploy/helm/contextosd | ./kubeconform -strict -summary -skip ServiceMonitor
          helm template t deploy/helm/contextosd --set autoscaling.enabled=true \
            --set-json 'packs={"support.json":{"pack_meta":{}}}' \
            --set-json 'networkPolicy.egressTo=[{"to":[{"ipBlock":{"cidr":"10.0.0.0/8"}}]}]' \
            | ./kubeconform -strict -summary -skip ServiceMonitor
          helm template t deploy/helm/contextosd --set serviceMonitor.enabled=true --set prometheusRule.enabled=true \
            | ./kubeconform -strict -summary -skip ServiceMonitor,PrometheusRule
          helm template t deploy/helm/contextosd --set prometheusRule.enabled=true --show-only templates/prometheusrule.yaml \
            | grep -q 'alert: ContextOSSharedGuaranteeSaturated'
          helm template t deploy/helm/contextosd --set migration.enabled=true --set migration.secretName=owner \
            | ./kubeconform -strict -summary -skip ServiceMonitor
          helm template t deploy/helm/contextosd \
            --set-json 'extraVolumes=[{"name":"corp-ca","configMap":{"name":"corp-ca"}}]' \
            --set-json 'extraVolumeMounts=[{"name":"corp-ca","mountPath":"/etc/contextos/ca","readOnly":true}]' \
            --set-json 'extraEnv=[{"name":"CONTEXTOS_CA_BUNDLE","value":"/etc/contextos/ca/ca.pem"}]' \
            | tee rendered.yaml | ./kubeconform -strict -summary -skip ServiceMonitor
          grep -q 'CONTEXTOS_CA_BUNDLE' rendered.yaml && grep -q 'mountPath: /etc/contextos/ca' rendered.yaml
      - name: Check and unit-test the alerting rules
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz \
            | tar xz --strip-components=1 prometheus-3.5.0.linux-amd64/promtool
          ./promtool check rules deploy/helm/contextosd/files/contextos-rules.yaml
          ./promtool test rules deploy/alerts/contextos-rules.test.yaml
