# Development Tower over the quickstart runtime (examples/tower/run.sh fills in the URL).
[server]
listen = "127.0.0.1:8090"
development = true

[journal]
signing_seed_env = "TOWER_JOURNAL_SEED"
key_id = "dev-tower-journal"

[[sources]]
id = "acme-support-eu"
url = "http://127.0.0.1:RUNTIME_PORT"
token_env = "TOWER_SOURCE_TOKEN"            # audit:read only
control_token_env = "TOWER_CONTROL_TOKEN"   # control, for the fleet kill switch
business_unit = "Customer Operations"
region = "eu-west-1"
environment = "production"

[intelligence]
# "anthropic" with ANTHROPIC_API_KEY set turns on Ask Tower, guardrail drafting,
# intake review drafts, anomaly briefs and run explanations.
provider = "off"

[collector]
poll_ms = 1000

[tower]
dir = "tower/dist"

# Development people (published keys, refused unless development = true):
