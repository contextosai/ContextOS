name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: tower
      - uses: actions/upload-artifact@v7
        with:
          name: tower-dist
          path: tower/dist

  binaries:
    needs: console
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p contextosd -p ctx -p towerd
      - uses: actions/download-artifact@v8
        with:
          name: tower-dist
          path: tower-dist
      - name: Package
        run: |
          scripts/package-release.sh "contextos-${GITHUB_REF_NAME}-${{ matrix.target }}" \
            target/${{ matrix.target }}/release tower-dist
      # The archive must run on its own: unpack it outside the checkout, without cargo
      # on PATH, and run the shared-guarantees demo from it.
      - name: Smoke-test the archive
        run: |
          dir="contextos-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$RUNNER_TEMP/smoke"
          tar xzf "$dir.tar.gz" -C "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke/$dir"
          env PATH="/usr/bin:/bin" ./examples/shared-guarantees/run.sh
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: contextos-*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: contextos-*.tar.gz*

  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: cargo install --locked cargo-cyclonedx@0.5.7
      - run: cargo cyclonedx --format json --all-features   # one <crate>.cdx.json per crate
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: crates/*/*.cdx.json

  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/contextosd:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/contextosd@${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/contextosd
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [binaries, sbom, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --notes "Verify: gh attestation verify <file> --repo $GITHUB_REPOSITORY; cosign verify ghcr.io/${GITHUB_REPOSITORY_OWNER}/contextosd@<digest> --certificate-identity-regexp 'https://github.com/$GITHUB_REPOSITORY/' --certificate-oidc-issuer https://token.actions.githubusercontent.com" \
            contextos-*.tar.gz* $(find . -name '*.cdx.json')
